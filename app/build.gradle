plugins { id 'com.android.application' }

android {
    namespace 'com.nook.widgets'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nook.widgets'
        minSdk 28
        targetSdk 35
        versionCode 12
        versionName '0.11.0'
        testInstrumentationRunner 'com.nook.widgets.test.NookSmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
